<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fire Safety DOCX Generator</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3a8a, #06b6d4);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 16px;
        width: 480px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
        color: #111;
    }

    p {
        text-align: center;
        color: #666;
        font-size: 13px;
        margin-bottom: 15px;
    }

    input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 2px dashed #bbb;
        border-radius: 10px;
        margin-bottom: 15px;
    }

    .section-title {
        margin: 10px 0 5px;
        font-size: 13px;
        font-weight: bold;
        color: #333;
    }

    .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
    }

    .field {
        display: flex;
        flex-direction: column;
    }

    .label {
        font-size: 11px;
        color: #444;
        margin-bottom: 3px;
    }

    input {
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 12px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #1d4ed8;
    }
</style>
</head>

<body>

<div class="card">

    <h1>🔥 Fire Safety DOCX</h1>
    <p>Upload template and generate report</p>

    <input type="file" id="fileInput" />

    <div class="section-title"></div>

    <div class="form">

        <div class="field">
            <div class="label">Company Name</div>
            <input id="COMPANYNAME" value="">
        </div>

        <div class="field">
            <div class="label">Company Number</div>
            <input id="COMPANYNUMBER" value="">
        </div>

        <div class="field">
            <div class="label">Date From</div>
            <input id="DATEFROM" value="">
        </div>

        <div class="field">
            <div class="label">Date To</div>
            <input id="DATETO" value="">
        </div>

        <div class="field">
            <div class="label">Price</div>
            <input id="PRICE" value="">
        </div>

    </div>

    <div class="section-title">Fire Safety Items</div>

    <div class="form">

        <div class="field"><div class="label">Fire blanket</div><input id="VAR1" value=""></div>
        <div class="field"><div class="label">Break glass alarm</div><input id="VAR2" value=""></div>
        <div class="field"><div class="label">Dry powder extinguisher</div><input id="VAR3" value=""></div>
        <div class="field"><div class="label">Emergency light</div><input id="VAR4" value=""></div>
        <div class="field"><div class="label">Smoke detector</div><input id="VAR5" value=""></div>
        <div class="field"><div class="label">Bell device</div><input id="VAR6" value=""></div>
        <div class="field"><div class="label">CO2 extinguisher</div><input id="VAR7" value=""></div>
        <div class="field"><div class="label">Exit light</div><input id="VAR8" value=""></div>

    </div>

    <button onclick="generate()">Generate DOCX</button>

</div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.5/dist/pizzip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
function getData() {
    return {
        COMPANYNAME: document.getElementById("COMPANYNAME").value,
        COMPANYNUMBER: document.getElementById("COMPANYNUMBER").value,
        DATEFROM: document.getElementById("DATEFROM").value,
        DATETO: document.getElementById("DATETO").value,
        PRICE: document.getElementById("PRICE").value,

        VAR1: document.getElementById("VAR1").value,
        VAR2: document.getElementById("VAR2").value,
        VAR3: document.getElementById("VAR3").value,
        VAR4: document.getElementById("VAR4").value,
        VAR5: document.getElementById("VAR5").value,
        VAR6: document.getElementById("VAR6").value,
        VAR7: document.getElementById("VAR7").value,
        VAR8: document.getElementById("VAR8").value
    };
}

function generate() {

    const file = document.getElementById("fileInput").files[0];

    if (!file) {
        alert("Please upload template.docx");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const zip = new PizZip(e.target.result);

        let xml = zip.file("word/document.xml").asText();

        const data = getData();

        for (const key in data) {
            xml = xml.replace(new RegExp(key, "g"), data[key]);
        }

        zip.file("word/document.xml", xml);

        const blob = zip.generate({ type: "blob" });

        saveAs(blob, data.COMPANYNAME + ".docx");
    };

    reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
